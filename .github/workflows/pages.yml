# Publica el panel en GitHub Pages y refresca los datos de HubSpot cada día.
# Requiere el secreto HUBSPOT_TOKEN (Settings → Secrets and variables → Actions).
name: Publicar panel

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # todos los días, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos de HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          if [ -n "$HUBSPOT_TOKEN" ]; then python3 actualizar.py; else echo "Sin HUBSPOT_TOKEN: se publica el data.js del repositorio"; fi
      - name: Preparar sitio
        run: mkdir _site && cp index.html data.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
